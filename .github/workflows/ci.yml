name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Deny-by-default GITHUB_TOKEN: every job declares exactly the scopes it
# needs, so a new job (or a repo default flipped to read-write) can't
# silently gain write access.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Engine (test + clippy + wasm)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: engine-${{ runner.os }}-cargo-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: engine-${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --verbose

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

      # Pin wasm-pack version. The action defaults to "latest" but uses cached
      # binaries if present, so without a pin different runners can land on
      # wildly different wasm-pack versions (we've seen v0.9.1 vs v0.15.0 in
      # the same workflow run). Older wasm-pack versions ship a too-old
      # wasm-opt that can't parse modern Rust Wasm output ("Only 1 table
      # definition allowed in MVP"). v0.13.1 matches the local dev version
      # and bundles a working wasm-opt (binaryen 117+).
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: 'v0.13.1'

      - name: Build Wasm
        run: wasm-pack build --target web

  backend:
    name: Backend (test + clippy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: corewar
          POSTGRES_PASSWORD: corewar
          POSTGRES_DB: corewar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://corewar:corewar@localhost:5432/corewar
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-that-is-at-least-32-bytes!!
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: backend-${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: backend-${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --verbose

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

  frontend:
    name: Frontend (lint + format + test + build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: engine
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: engine-${{ runner.os }}-cargo-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: engine-${{ runner.os }}-cargo-

      # Pin wasm-pack version. The action defaults to "latest" but uses cached
      # binaries if present, so without a pin different runners can land on
      # wildly different wasm-pack versions (we've seen v0.9.1 vs v0.15.0 in
      # the same workflow run). Older wasm-pack versions ship a too-old
      # wasm-opt that can't parse modern Rust Wasm output ("Only 1 table
      # definition allowed in MVP"). v0.13.1 matches the local dev version
      # and bundles a working wasm-opt (binaryen 117+).
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: 'v0.13.1'

      - name: Build Wasm engine
        run: wasm-pack build --target web
        working-directory: engine

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  audit:
    name: Supply-chain audit (cargo + npm)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Independent of test jobs — supply-chain advisories shouldn't block
    # faster signals from clippy/tests, and shouldn't be blocked BY them
    # either. Runs in parallel with engine/backend/frontend.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch

      # Cache the cargo-audit binary so we don't pay the install cost
      # on every CI run. Invalidates when the runner OS changes.
      - name: Cache cargo-audit binary
        id: cache-cargo-audit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}

      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      # cargo audit fails on any RustSec advisory — there's no built-in
      # severity filter. RustSec is hand-curated so false positives are
      # rare; if one shows up we can `cargo audit --ignore RUSTSEC-XXX`
      # with a justifying comment rather than loosening globally.
      - name: Audit engine deps
        run: cargo audit
        working-directory: engine

      # RUSTSEC-2023-0071 (`rsa` 0.9.x Marvin timing sidechannel) has no
      # upstream fix. The crate enters our Cargo.lock via sqlx-mysql,
      # which sqlx-macros-core pulls in for compile-time query checking
      # against all DB backends. We don't actually link against MySQL
      # support — `cargo tree --target all -i rsa` shows no reachable
      # path from `core-war-backend`. Revisit when the rsa crate ships
      # a constant-time fix.
      - name: Audit backend deps
        run: cargo audit --ignore RUSTSEC-2023-0071
        working-directory: backend

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm audit reads the lockfile and queries the registry — it
      # doesn't need node_modules, so we skip `npm ci` here. The
      # frontend's `file:` engine dep would otherwise force a wasm-pack
      # build just to satisfy install, which audit doesn't actually need.
      # --audit-level=high: fail on high or critical, ignore moderate/low.
      - name: Audit frontend deps
        run: npm audit --audit-level=high
        working-directory: frontend
