name: Deploy backend

# Triggers:
#   - push to master: build + push image to ghcr.io, then (if DEPLOY_ENABLED)
#     ssh into the droplet and roll out the new image.
#   - pull_request: build only (no push, no deploy) so Dockerfile breakage
#     gets caught before merge.
#   - workflow_dispatch: manual trigger from the Actions tab — useful for
#     re-deploying after a Caddyfile change or a manual config tweak on the
#     droplet, without needing a code change to land on master.
on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'engine/**'
      - 'Caddyfile'
      - 'docker-compose.prod.yml'
      - 'deploy/compose.sh'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches: [master]
    paths:
      - 'backend/**'
      - 'engine/**'
      - 'Caddyfile'
      - 'docker-compose.prod.yml'
      - 'deploy/compose.sh'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# Deny-by-default GITHUB_TOKEN: every job declares exactly the scopes it
# needs, so a new job (or a repo default flipped to read-write) can't
# silently gain write access.
permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build (and push on master) backend image
    runs-on: ubuntu-latest
    # Only one build can be in flight per ref. On a burst of master
    # merges, older builds are canceled and only the tip actually gets
    # built + pushed — no `:latest` race between concurrent finish
    # times, and only one deploy queues downstream. Same-branch PR
    # pushes get the same treatment (older CI is canceled when a new
    # commit lands). See issue #78.
    concurrency:
      group: deploy-backend-build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
      # The exact SHA-pinned tag this build pushed, consumed by the
      # deploy job so it's bound to THIS run's commit rather than
      # racing for whatever `:latest` happens to point at.
      tag: ${{ steps.image_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute lowercase image ref
        id: image
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=${REGISTRY}/${OWNER_LC}/core-war-backend" >> "$GITHUB_OUTPUT"

      - name: Compute immutable image tag
        id: image_tag
        # Matches the SHA tag docker/metadata-action produces below
        # (`type=sha,prefix=master-` → default 7-char short SHA). Kept
        # in sync manually — if either format changes, both need to
        # move together.
        run: |
          SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "tag=master-${SHORT}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=master-,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build and (on master) push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to droplet
    needs: build
    # Gated by a repo variable so we don't try to ssh into a droplet that
    # doesn't exist yet. Flip vars.DEPLOY_ENABLED to 'true' once you've
    # provisioned the droplet and added the secrets below.
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # The `production` environment only accepts deployments from master
    # (Settings → Environments), and the DROPLET_* secrets live there. A
    # workflow_dispatch from any other branch is refused before this job
    # starts, and can't read the secrets.
    environment: production
    permissions:
      contents: read
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      # Pinned host key, not ssh-keyscan: a keyscan at deploy time trusts
      # whatever answers, so an interception would receive the deploy.
      # DROPLET_KNOWN_HOSTS holds the droplet's public host key line (see
      # deploy/README.md). If the droplet is rebuilt, update the secret.
      - name: Trust droplet host key
        env:
          KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          if [[ -z "$KNOWN_HOSTS" ]]; then
            echo "ERROR: DROPLET_KNOWN_HOSTS secret is not set; refusing to deploy." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts

      - name: Sync compose + Caddyfile + compose.sh to droplet
        # No --delete: we don't want to nuke .env.production on the
        # destination, and the only files we push are listed explicitly
        # anyway. deploy/compose.sh lands as ~/corewar/compose.sh.
        run: |
          rsync -azh \
            docker-compose.prod.yml Caddyfile deploy/compose.sh \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:~/corewar/"

      - name: Pull image + restart stack + verify health
        env:
          # Deploy pins to the exact SHA this build produced. Race-immune
          # against concurrent master merges — `:latest` may have been
          # overwritten by a parallel build that finished later, but the
          # tag we pass through here is bound to THIS run's commit and
          # was pushed to GHCR before this job started (build → deploy
          # is a `needs:` edge). See issue #78.
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          # Pass BACKEND_IMAGE_TAG through to the remote via the ssh
          # command prefix — the outer shell expands $IMAGE_TAG (local
          # runner env), the remote bash sees the literal assignment.
          # This works even when the heredoc is quoted (which we want
          # so remote-only variables like $SECONDS don't leak upward).
          ssh "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" "BACKEND_IMAGE_TAG=$IMAGE_TAG bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/corewar

          if [[ ! -f .env.production ]]; then
              echo "ERROR: ~/corewar/.env.production not found. Run the manual" >&2
              echo "       bootstrap first (deploy/README.md section 7)." >&2
              exit 1
          fi

          echo "==> Deploying backend at tag ${BACKEND_IMAGE_TAG}"
          # compose.sh passes an explicit BACKEND_IMAGE_TAG through (shell
          # env wins over --env-file), so every command below runs this
          # run's tag.
          export BACKEND_IMAGE_TAG

          echo "==> Pulling backend image"
          ./compose.sh pull backend

          # Record the tag before anything restarts, so a manual
          # ./compose.sh on the droplet runs what is deployed even if a
          # later step fails. docker-compose.prod.yml has no fallback tag.
          printf '%s\n' "$BACKEND_IMAGE_TAG" > .backend-image-tag

          echo "==> Restarting stack"
          ./compose.sh up -d --remove-orphans

          # Caddyfile is a single-file bind mount. rsync replaces the host
          # file via write-new + rename, which leaves the running container
          # pointed at the original inode and blind to config changes. Force
          # caddy to be recreated so its bind mount re-resolves to the new
          # file. ~1s bounce, no data loss (caddy_data + caddy_config are
          # named volumes that survive container recreation).
          echo "==> Recreating caddy to refresh single-file bind mount"
          ./compose.sh up -d --force-recreate caddy

          # When the `app` network's settings change, `up -d` recreates the
          # network but reattaches the containers it didn't recreate
          # (postgres, redis) without their service-name aliases. The
          # backend then can't resolve `postgres` and crash-loops, as on
          # #178's deploy. Recreating every container restores the aliases.
          # Checking the symptom rather than predicting the network change
          # also catches anything else that leaves a service unresolvable.
          missing_aliases() {
              local svc id aliases missing=()
              for svc in $(./compose.sh config --services); do
                  id=$(./compose.sh ps -aq "$svc")
                  aliases=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{join .Aliases " "}} {{end}}' $id 2>/dev/null || true)
                  [[ " $aliases " == *" $svc "* ]] || missing+=("$svc")
              done
              echo "${missing[*]}"
          }
          missing=$(missing_aliases)
          if [[ -n "$missing" ]]; then
              echo "==> No network alias for: $missing. Recreating all containers"
              ./compose.sh up -d --force-recreate
              missing=$(missing_aliases)
              if [[ -n "$missing" ]]; then
                  echo "ERROR: still no network alias for: $missing" >&2
                  ./compose.sh ps -a >&2
                  exit 1
              fi
          fi

          echo "==> Waiting up to 60s for backend to be healthy"
          end=$((SECONDS + 60))
          while [[ $SECONDS -lt $end ]]; do
              state=$(docker inspect -f '{{.State.Health.Status}}' corewar-prod-backend-1 2>/dev/null || echo "starting")
              if [[ "$state" == "healthy" ]]; then
                  echo "==> Backend healthy"
                  ./compose.sh ps
                  docker image prune -f
                  exit 0
              fi
              echo "    backend state: $state"
              sleep 3
          done

          echo "ERROR: backend did not become healthy within 60s" >&2
          ./compose.sh logs --tail 80 backend >&2
          exit 1
          REMOTE
